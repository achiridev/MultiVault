spring:
  application:
    name: multivault

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        hbm2ddl:
          schema_filter_provider: dev.achiri.multivault.infrastructure.persistence.config.TenantSchemaFilterProvider
  servlet:
    multipart:
      max-file-size: ${UPLOAD_MAX_FILE_SIZE:100MB}
      max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:105MB}

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      repositories:
        enabled: false

  cache:
    type: redis

storage:
  backblaze-b2:
    enabled: ${B2_ENABLED:false}
    endpoint: ${B2_ENDPOINT:}
    region: ${B2_REGION:}
    access-key: ${B2_ACCESS_KEY:}
    secret-key: ${B2_SECRET_KEY:}
    bucket: ${B2_BUCKET:}

multivault:
  upload:
    max-size-bytes: ${UPLOAD_MAX_SIZE_BYTES:104857600}
    allowed-mime-types: ${UPLOAD_ALLOWED_MIME_TYPES:application/pdf,text/plain,text/csv,image/png,image/jpeg,image/webp,image/gif,application/json,application/zip,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.openxmlformats-officedocument.presentationml.presentation}

server:
  port: ${PORT:8080}
